StylesPath = vale/styles
MinAlertLevel = warning

Packages = alex, proselint, write-good

IgnoredScopes = code, strong, tt

# Specifies what Vale considers to be a boundary between words.
WordTemplate = \s(?:%s)\s

# The "formats" section allows you to associate an "unknown" format
# with one of Vale's supported formats.
[formats]
mdx = md

# Global settings (applied to every syntax)
[*{.md,mdx}]
# List of styles to load
BasedOnStyles = alex, proselint, write-good

# Disable low-signal rules that create a lot of false positives in narrative writing.
write-good.E-Prime = NO
write-good.Weasel = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Adverbs = NO

# Keep this rule but lower severity from error to warning.
write-good.ThereIs = warning
write-good.So = warning

# Avoid occasional false positives for words like "reject" in software context.
alex.ProfanityUnlikely = NO

# "primitive" (data types, UUIDs) and "just"/"easy" describing how simple something
# turned out to be are not insensitive language; these fire constantly in technical
# writing and were never actually about a person.
alex.Race = NO
alex.Condescending = NO

# This blog deliberately writes "3am" without a space or periods as a stylistic
# choice (e.g. "Why Every Integration Needs an Owner"); don't fight that.
proselint.DateCase = NO
proselint.DateSpacing = NO

# Straight quotes around a quoted word or phrase are this blog's established
# convention, used in every post; don't flag every one as an error.
proselint.CurlyQuotes = NO

# Duplicates write-good.Adverbs's flag on "very", at error severity with a joke
# message ("substitute 'damn'..."); not a build-blocking problem either way.
proselint.Very = NO
