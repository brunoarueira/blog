[build]
  command = "npx playwright install chromium && yarn build"
  publish = "dist"

[[plugins]]
  package = "./netlify/plugins/playwright-cache"

[[headers]]
  for = "/*"

  [headers.values]
    Permissions-Policy="interest-cohort=()"

# Self-hosted fonts: filename encodes family + weight, so the bytes never change
# under a given path — safe to cache hard at the browser and the Cloudflare edge.
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro build assets are content-hashed in the filename, so a given URL is
# immutable. Netlify's default (max-age=43200, must-revalidate) makes the
# browser and the Cloudflare edge re-check them on every visit for nothing.
[[headers]]
  for = "/_astro/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
